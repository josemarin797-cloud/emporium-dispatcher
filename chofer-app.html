:root {
    --bg: #0f0f0f;
    --card: #181818;
    --card2: #202020;
    --border: #2a2a2a;
    --gold: #ffb703;
    --green: #06d6a0;
    --orange: #f77f00;
    --red: #d90429;
    --text: #e8e8e8;
    --muted: #666;
    --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

/* ── PANTALLA BIENVENIDA ── */
#screen-login {

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 24px;
}
.logo-wrap { text-align: center; margin-bottom: 40px; }
.logo-icon { font-size: 3rem; margin-bottom: 10px; }
.logo-title { font-size: 1.3rem; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
.logo-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

.select-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; text-align: center; }
.chofer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; margin-bottom: 28px; }
.chofer-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
}
.chofer-btn:active { background: #252525; }
.chofer-btn.selected { border-color: var(--gold); background: #1e1800; }
.chofer-avatar { font-size: 1.6rem; margin-bottom: 6px; }
.chofer-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
.chofer-unit { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

.btn-huella {
    width: 100%;
    max-width: 340px;
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.15s;
}
.btn-huella:active { opacity: 0.85; }
.btn-huella:disabled { background: #333; color: #666; cursor: default; }
.huella-icon { font-size: 1.4rem; }

/* ── PANTALLA PRINCIPAL ── */
#screen-main { display: none; min-height: 100vh; }

.topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-avatar {
    width: 38px; height: 38px;
    background: #1e1800;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
}
.topbar-name { font-size: 0.95rem; font-weight: 700; }
.topbar-unit { font-size: 0.75rem; color: var(--muted); }
.btn-salir {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.75rem;
    cursor: pointer;
}

.content { padding: 20px 16px; max-width: 500px; margin: 0 auto; }

.dia-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}

/* Stats rápidos */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
.stat-n { font-size: 1.8rem; font-weight: 700; }
.stat-l { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.n-pend { color: var(--orange); }
.n-entg { color: var(--green); }

/* Boletas */
.boleta-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
}
.boleta-card.entregada { border-color: #0a3a28; }
.boleta-card.urgente { border-color: #3a0a0a; }

.boleta-header {

    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);

.boleta-codigo { font-family: monospace; font-size: 0.78rem; color: var(--gold); letter-spacing: 0.5px; }
.badge { display: inline-block; border-radius: 20px; padding: 3px 10px; font-size: 0.72rem; font-weight: 700; }
.badge-pend { background: #2e1a00; color: var(--orange); }
.badge-entg { background: #0a2e1a; color: var(--green); }
.badge-urg  { background: #2e0a0a; color: var(--red); }

.boleta-body { padding: 14px 16px; }
.ruta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.origen-tag { background: #0f1a0f; color: #7fff7f; border: 1px solid #2a5a2a; border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600; }
.flecha { color: var(--gold); font-size: 1rem; }
.destinos-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.dest-tag { background: #1e2a00; color: #b8ff6e; border: 1px solid #4a7a00; border-radius: 6px; padding: 3px 9px; font-size: 0.75rem; }

.hora-salida { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }

.btn-entregar {
    width: 100%;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
}
.btn-entregar:active { opacity: 0.85; transform: scale(0.98); }

.entregada-info {
    text-align: center;
    color: var(--green);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px;
}

.empty-state {

    padding: 50px 20px;
    color: var(--muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-text { font-size: 0.9rem; }

/* Refresh btn */
.btn-refresh {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 10px;
}
.btn-refresh:active { background: var(--card2); }

/* Toast */
#toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--green); color: #000; padding: 12px 24px; border-radius: 30px;
    font-weight: 700; font-size: 0.9rem; opacity: 0; transition: all 0.3s; pointer-events: none;
    white-space: nowrap; z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.loading { text-align: center; padding: 30px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>

    async function notificarDiscord(chofer, mensaje, fotoUrl, vehiculo = null) {
        // Usar webhook por vehículo siempre — si no hay vehículo, usar el del chofer
        const veh = vehiculo || choferActual?.unidad || '';

        try {

    let choferSeleccionado = null;

    async function sbFetch(method, path, body) {
        const headers = {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json',
        };
        if (method === 'POST') headers['Prefer'] = 'resolution=merge-duplicates';
        if (method === 'PATCH') headers['Prefer'] = 'return=minimal';

        const res = await fetch(SB_URL + path, {
            method,
            headers,
            body: body ? JSON.stringify(body) : undefined
        });
        if (!res.ok) {
            const err = await res.text().catch(() => '');
            console.error('sbFetch error', method, path, res.status, err);
            return null;
        }
        try { return await res.json(); } catch { return null; }
    }

    function seleccionarChofer(el, nombre, unidad) {
        document.querySelectorAll('.chofer-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        choferSeleccionado = { nombre, unidad };

            localStorage.setItem('emp_chofer', JSON.stringify({ ...choferConVehiculo, unidad: '' }));
            entrarConChofer(choferConVehiculo);
        });
    }

    async function entrarConHuella() {
        // Si ya hay selector de vehículo abierto, no hacer nada
        if (document.getElementById('modal-vehiculo')) return;

        // Si ya tiene chofer guardado, usarlo directamente
        const guardado = localStorage.getItem('emp_chofer');
        const choferParaUsar = guardado ? JSON.parse(guardado) : choferSeleccionado;

        if (!choferParaUsar) { mostrarToast('Selecciona tu nombre primero'); return; }

        // Intentar autenticación biométrica
        try {
            const cred = await navigator.credentials.get({
                publicKey: {
                    challenge: crypto.getRandomValues(new Uint8Array(32)),
                    timeout: 60000,
                    userVerification: 'required',
                    rpId: window.location.hostname || 'localhost'
                }
            });
            // Si llegó aquí, huella ok
            entrar(choferParaUsar);
        } catch (e) {
            // Si biometría no disponible o falla, preguntar PIN simple
            const pin = prompt('Huella no disponible. Ingresa tu PIN (0000):');
            if (pin === '0000' || pin === choferParaUsar.nombre.split(' ')[0].toLowerCase()) {
                entrar(choferParaUsar);
            } else {
                mostrarToast('PIN incorrecto');
            }
        }
    }

            localStorage.setItem('emp_chofer', JSON.stringify({ ...choferConVehiculo, unidad: '' }));
            entrarConChofer(choferConVehiculo);
        });

        document.getElementById('topbar-avatar').textContent = AVATARES[chofer.nombre] || '🚚';

        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-main').style.display = 'block';

        // Fecha
        const hoy = new Date().toLocaleDateString('es-VE', {weekday:'long', day:'numeric', month:'long'});
        document.getElementById('dia-label').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);

        cargarBoletas();
        setInterval(() => { if (!fotoEnProceso) cargarBoletas(); }, 30000);

        // Restaurar movimiento activo si quedó pendiente

        if (movGuardado) {
            try {
                const mov = JSON.parse(movGuardado);
                movimientoActivo = mov;
                mostrarBotonLlegada(mov.nota?.substring(0, 40) || mov.destino || '...', mov.vehiculo);

        mostrarDecalogo(chofer.nombre.split(' ')[0]);
    }

        choferActual = chofer;
        // Intentar ambos IDs posibles
        const loginEl = document.getElementById('pantalla-login') || document.getElementById('screen-login');
        const mainEl = document.getElementById('pantalla-main') || document.getElementById('screen-main');

        if (mainEl) mainEl.style.display = 'block';

    // Sonido de alerta para urgentes
    function sonarAlarma() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const beep = (freq, start, dur) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'square';
                gain.gain.setValueAtTime(0.3, ctx.currentTime + start);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
                osc.start(ctx.currentTime + start);
                osc.stop(ctx.currentTime + start + dur);
            };
            beep(880, 0, 0.15);
            beep(880, 0.2, 0.15);
            beep(1100, 0.4, 0.3);
        } catch(e) {}
    }

    let boletasUrgentesVistas = new Set();

    async function cargarBoletas() {
        if (!choferActual) return;
        const hoy = new Date().toISOString().slice(0, 10);
        const nombre = choferActual.nombre;

        const lista = await sbFetch('GET',
            `/rest/v1/boletas?fecha=eq.${hoy}&chofer=eq.${encodeURIComponent(nombre)}&order=created_at.asc&select=*`
        ) || [];

        // Detectar nuevas boletas urgentes
        lista.forEach(b => {
            if (b.prioridad && b.prioridad.includes('Urgente') && b.estado !== 'entregada') {
                if (!boletasUrgentesVistas.has(b.id)) {
                    boletasUrgentesVistas.add(b.id);
                    sonarAlarma();
                    mostrarToast('🔴 ¡BOLETA URGENTE RECIBIDA!');
                }
            }
        });

        renderBoletas(lista);

        // Restaurar banner de movimiento si hay uno activo
        if (!document.getElementById('banner-llegada-movimiento')) {
            const movGuardado = localStorage.getItem('movimientoActivo');
            if (movGuardado) {
                try {
                    const mov = JSON.parse(movGuardado);
                    movimientoActivo = mov;
                    mostrarBotonLlegada(mov.nota?.substring(0, 40) || '...', mov.vehiculo);
                } catch(e) {}
            }
        }
    }

        const cont = document.getElementById('boletas-lista');

        if (lista.length === 0) {

            document.getElementById('s-entg').textContent = 0;

        }

        cont.innerHTML = '';
        // Guardar en caché para actualizaciones locales
        boletasCache = lista;
        // Filtrar boletas: ocultar las que están entregadas o completadas localmente
        const listaActiva = lista.filter(b => {
            if (b.estado === 'entregada') return false;
            // Verificar si todas las entregas están confirmadas localmente
            const envios = b.envios ? JSON.parse(b.envios) : [];
            const detalle = b.entregas_detalle ? JSON.parse(b.entregas_detalle) : {};
            let todasOk = envios.length > 0;
            envios.forEach(e => {
                (e.destinos || []).forEach(suc => {
                    const k = `${b.id}_${parseInt(e.num)}_${suc}`;

        if (listaActiva.length === 0 && lista.length > 0) {

            // Calcular pendientes reales del chofer

            lista.filter(b => b.chofer === choferActual.nombre && b.estado !== 'entregada').forEach(b => {
                const det = b.entregas_detalle ? JSON.parse(b.entregas_detalle) : {};

    let movFotoFile = null;
    function agregarFotoMovimiento() {
        const inp = document.createElement('input');

        inp.onchange = () => {
            movFotoFile = inp.files[0];
            const cont = document.getElementById('mov-foto-cont');
            if (cont && movFotoFile) {
                const reader = new FileReader();
                reader.onload = e => {

                reader.readAsDataURL(movFotoFile);
            }
        };
        inp.click();

    function usarMicrofonoMovimiento() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            mostrarToast('⚠️ Tu navegador no soporta dictado'); return;
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'es-VE'; rec.interimResults = false;
        mostrarToast('🎤 Escuchando...');
        rec.start();
        rec.onresult = e => { document.getElementById('mov-nota').value = e.results[0][0].transcript; mostrarToast('✅ Texto capturado'); };
        rec.onerror = () => mostrarToast('⚠️ No se pudo capturar');
    }

        const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Subir foto si hay
        let fotoUrl = null;
        if (movFotoFile) {
            try {
                const ext = movFotoFile.type === 'image/png' ? 'png' : 'jpg';
                const nombreBase = choferActual.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');

    async function registrarLlegada(destino, vehiculo) {
        const ahora = new Date();
        const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Calcular tiempo en ruta
        let tiempoRuta = '';
        const movGuardado = movimientoActivo || JSON.parse(localStorage.getItem('movimientoActivo') || 'null');
        if (movGuardado) {
            const diffMin = Math.round((ahora.getTime() - movGuardado.ts) / 60000);
            if (diffMin > 0) tiempoRuta = `\n🛣️ Tiempo en ruta: ${diffMin} min`;
            movimientoActivo = null;
            localStorage.removeItem('movimientoActivo');
        }

        // Subir foto si hay
        let fotoUrl = null;
        if (llegadaFotoFile) {
            try {
                const ext = llegadaFotoFile.type === 'image/png' ? 'png' : 'jpg';
                const nombreBase = choferActual.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
                const nombre = `movimientos/${nombreBase}_llegada_${Date.now()}.${ext}`;
                const res = await fetch(`${SB_URL}/storage/v1/object/fotos-flota/${nombre}`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': llegadaFotoFile.type },
                    body: llegadaFotoFile
                });
                if (res.ok) fotoUrl = `${SB_URL}/storage/v1/object/public/fotos-flota/${nombre}`;
            } catch(e) {}
            llegadaFotoFile = null;
        }

        const dondeInput = document.getElementById('llegada-donde')?.value?.trim();
        const dondeStr = dondeInput ? `\n📍 Llegó a: ${dondeInput}` : '';
        const notaOrigen = movGuardado?.nota ? `\n🚗 Venía: ${movGuardado.nota}` : '';
        await notificarDiscord(choferActual.nombre,
            `📍 **${choferActual.nombre.split(' ')[0]} — Llegada confirmada**\n🕐 ${hora} | ${vehiculo}${tiempoRuta}${dondeStr}${notaOrigen}`,
            fotoUrl, vehiculo
        );

        document.getElementById('banner-llegada-movimiento')?.remove();
        mostrarToast(`✅ Llegada registrada en ${destino}`);
    }

    async function registrarRecogida() {
        const origenSel = document.getElementById('rec-origen')?.value;
        const origenLibre = document.getElementById('rec-origen-libre')?.value?.trim();
        const origen = origenSel === 'Otra dirección' ? (origenLibre || 'Otra dirección') : origenSel;

        const destSels = document.querySelectorAll('.rec-dest-sel');
        const destinos = Array.from(destSels).map(s => s.value).filter(Boolean);
        if (destinos.length === 0) { mostrarToast('⚠️ Agrega al menos una sucursal de entrega'); return; }

        const vehiculoRec = document.getElementById('rec-vehiculo')?.value || choferActual.unidad || '';
        const itemsRec = Array.from(document.querySelectorAll('.rec-item-dpto')).map(s => ({ dpto: s.value })).filter(i => i.dpto);

        // Subir fotos
        const fotosUrls = [];
        const fotoInputs = document.querySelectorAll('#rec-fotos-cont input[type=file]');
        for (const inp of fotoInputs) {
            const file = inp.files[0];
            if (!file) continue;
            fotoEnProceso = true;
            try {
                const ext = file.type === 'image/png' ? 'png' : 'jpg';
                const nombreBase = choferActual.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
                const nombre = `recogidas/${nombreBase}_${Date.now()}_${Math.random().toString(36).slice(2,5)}.${ext}`;
                const res = await fetch(`${SB_URL}/storage/v1/object/fotos-flota/${nombre}`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': file.type || 'image/jpeg' },
                    body: file
                });
                if (res.ok) fotosUrls.push(`${SB_URL}/storage/v1/object/public/fotos-flota/${nombre}`);
            } catch(e) {}
        }
        fotoEnProceso = false;

        const ahora = new Date();
        const fechaLocal = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getDate()).padStart(2,'0')}`;
        const hora = ahora.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const codigo = `REC-${String(ahora.getDate()).padStart(2,'0')}${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getHours()).padStart(2,'0')}${String(ahora.getMinutes()).padStart(2,'0')}-${choferActual.nombre.split(' ')[0].toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}`;

        const envio = { num: 1, recoge: origen, destinos, items: itemsRec, prioSuc: {} };
        const boleta = {
            id: codigo, chofer: choferActual.nombre, vehiculo: vehiculoRec,
            hora_salida: hora, hora_emision: hora,
            destinos: destinos.join(', '), prioridad: 'Normal', estado: 'pendiente',
            fecha: fechaLocal, envios: JSON.stringify([envio]),
            entregas_detalle: JSON.stringify({ [`${codigo}_1_recogida`]: `${hora}|fotos:${fotosUrls.join(',')}` })
        };

        await sbFetch('POST', '/rest/v1/boletas', boleta);

        const notaRec = document.getElementById('rec-nota')?.value?.trim() || '';
        const msg = `📦 **Recogida registrada — ${codigo}**\n🕐 ${hora} | ${vehiculoRec}\n👤 ${choferActual.nombre.split(' ')[0]}\n📍 Recoge en: ${origen}\n🚚 Destinos: ${destinos.join(', ')}${notaRec ? '\n💬 ' + notaRec : ''}`;
        await notificarDiscord(choferActual.nombre, msg, fotosUrls[0] || null, vehiculoRec);
        for (let i = 1; i < fotosUrls.length; i++) {
            await notificarDiscord(choferActual.nombre, `📷 Foto ${i+1} de ${fotosUrls.length}`, fotosUrls[i], vehiculoRec);
        }

        document.getElementById('modal-recogida').remove();
        mostrarToast(`✅ Recogida registrada — ${codigo}`);
        cargarBoletas();
    }

    async function registrarCDE() {
        // Validar destinos
        const destSels = document.querySelectorAll('.cde-dest-sel');
        const destinos = Array.from(destSels).map(s => s.value).filter(Boolean);
        if (destinos.length === 0) { mostrarToast('⚠️ Agrega al menos una sucursal de entrega'); return; }

        // Validar que haya al menos una foto
        const fotoInputs = document.querySelectorAll('#cde-fotos-cont input[type=file]');
        const hayFotosCDE = Array.from(fotoInputs).some(inp => inp.files[0]);
        if (!hayFotosCDE) { mostrarToast('⚠️ Debes tomar al menos una foto del documento'); return; }

        // Subir fotos
        const fotosUrls = [];
        for (const inp of fotoInputs) {
            const file = inp.files[0];
            if (!file) continue;
            fotoEnProceso = true;
            try {
                const ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
                const nombreBase = choferActual.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
                const nombre = `cde/${nombreBase}_${Date.now()}_${Math.random().toString(36).slice(2,5)}.${ext}`;
                const res = await fetch(`${SB_URL}/storage/v1/object/fotos-flota/${nombre}`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': file.type || 'image/jpeg' },
                    body: file
                });
                if (res.ok) fotosUrls.push(`${SB_URL}/storage/v1/object/public/fotos-flota/${nombre}`);
            } catch(e) {}
        }
        fotoEnProceso = false;

        // Generar código de boleta
        const ahora = new Date();
        const fechaLocal = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getDate()).padStart(2,'0')}`;
        const hora = ahora.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const codigo = `CDE-${String(ahora.getDate()).padStart(2,'0')}${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getHours()).padStart(2,'0')}${String(ahora.getMinutes()).padStart(2,'0')}-${choferActual.nombre.split(' ')[0].toUpperCase()}`;

        const envio = {
            num: 1,
            recoge: 'CDE',
            destinos,
            items: [],
            prioSuc: {}
        };

        const vehiculoCDE = document.getElementById('cde-vehiculo')?.value || choferActual.unidad || '';
        const boleta = {
            id: codigo,
            chofer: choferActual.nombre,
            vehiculo: vehiculoCDE,
            hora_salida: hora,
            hora_emision: hora,
            destinos: destinos.join(', '),
            prioridad: 'Normal',
            estado: 'pendiente',
            fecha: fechaLocal,
            envios: JSON.stringify([envio]),
            entregas_detalle: JSON.stringify({ [`${codigo}_1_recogida`]: `${hora}|fotos:${fotosUrls.join(',')}` })
        };

        await sbFetch('POST', '/rest/v1/boletas', boleta);

        // Notificar Discord
        const notaCDE = document.getElementById('cde-nota')?.value?.trim() || '';
        const msg = `📦 **Carga CDE registrada — ${codigo}**\n🕐 ${hora} | ${vehiculoCDE}\n👤 ${choferActual.nombre.split(' ')[0]}\n📍 Destinos: ${destinos.join(', ')}${notaCDE ? '\n💬 ' + notaCDE : ''}`;
        await notificarDiscord(choferActual.nombre, msg, fotosUrls[0] || null, vehiculoCDE);
        for (let i = 1; i < fotosUrls.length; i++) {
            await notificarDiscord(choferActual.nombre, `📷 Foto ${i+1} de ${fotosUrls.length}`, fotosUrls[i], vehiculoCDE);
        }

        document.getElementById('modal-cde').remove();
        mostrarToast(`✅ Carga CDE registrada — ${codigo}`);
        cargarBoletas();
    }

    async function confirmarAgregarEntrega(boletaId, envioNum) {
        const sucursal = document.getElementById('ae-sucursal')?.value;
        const dpto = document.getElementById('ae-dpto')?.value;

        const lista = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=*`);
        if (!lista || !lista[0]) return;
        const b = lista[0];
        const envios = JSON.parse(b.envios || '[]');
        const envio = envios.find(e => parseInt(e.num) === parseInt(envioNum));
        if (!envio) return;

        // Agregar sucursal solo si no existe ya
        if (!envio.destinos) envio.destinos = [];
        if (!envio.destinos.includes(sucursal)) envio.destinos.push(sucursal);
        if (!envio.items) envio.items = [];
        envio.items.push({ dpto });

        await sbFetch('PATCH', `/rest/v1/boletas?id=eq.${boletaId}`, {
            envios: JSON.stringify(envios),
            destinos: envios.flatMap(e => e.destinos || []).join(', ')
        });

        // Subir foto si hay y notificar Discord
        const vehiculoBoleta = b.vehiculo || choferActual.unidad || '';
        let fotoUrl = null;
        if (aeFotoFile) {
            try {

                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': aeFotoFile.type },
                    body: aeFotoFile
                });
                if (res.ok) fotoUrl = `${SB_URL}/storage/v1/object/public/fotos-flota/${nombre}`;
            } catch(e) {}
            aeFotoFile = null;
        }

        const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        await notificarDiscord(choferActual.nombre,
            `➕ **Entrega agregada — ${boletaId}**\n🕐 ${hora} | ${vehiculoBoleta}\n👤 ${choferActual.nombre.split(' ')[0]}\n📦 ${dpto} → 📍 ${sucursal}`,

    async function confirmarTrasbordoSucursal(boletaId, envioNum, sucursal, origen) {
        const choferReceptor = document.getElementById('trsuc-chofer')?.value;
        const descripcion = document.getElementById('trsuc-desc')?.value?.trim() || sucursal;
        const vehiculos = {
            'Darwin Serrano': 'Jack 07', 'Daniel Subero': 'NPR 01', 'Richard Hernandez': 'NPR 02',
            'Willmer Fernández': 'Fuso 03', 'Jackson Hernandez': 'Jack 06', 'Jesús Lara': 'L300 05',
            'Néstor Daniel': 'NPR 04', 'José Marín': choferActual.unidad || ''
        };
        const vehiculoReceptor = vehiculos[choferReceptor] || '';
        const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const ahora = new Date();
        const fechaLocal = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getDate()).padStart(2,'0')}`;

        // 1. Marcar sucursal como trasbordo en la boleta original
        const listaBoleta = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=*`);
        if (!listaBoleta || !listaBoleta[0]) return;
        const b = listaBoleta[0];
        const detalle = JSON.parse(b.entregas_detalle || '{}');
        const vehiculoBoleta = b.vehiculo || choferActual.unidad || '';

        const key = `${boletaId}_${parseInt(envioNum)}_${sucursal}`;
        detalle[key] = `TRASBORDO ${hora} — A ${choferReceptor.split(' ')[0]} (${vehiculoReceptor}): ${descripcion}`;

        // Verificar si todas las sucursales quedaron procesadas
        const envios = JSON.parse(b.envios || '[]');
        let todasProcesadas = true;
        envios.forEach(e => {
            (e.destinos || []).forEach(s => {
                const k = `${boletaId}_${parseInt(e.num)}_${s}`;
                // Ya marcamos key arriba, así que también lo contamos
                if (k !== key && !detalle[k]) todasProcesadas = false;
            });
        });
        // Si no hay más sucursales sin procesar, marcar como entregada


        // Marcar en localStorage para que desaparezca de inmediato
        entregasConfirmadas[key] = `TRASBORDO ${hora}`;
        localStorage.setItem('entregasConfirmadas', JSON.stringify(entregasConfirmadas));

        await sbFetch('PATCH', `/rest/v1/boletas?id=eq.${boletaId}`, {
            entregas_detalle: JSON.stringify(detalle),
            estado: todasProcesadas ? 'entregada' : 'pendiente'
        });

        // 2. Crear boleta TRB para el receptor
        const codigoTrb = `TRB-${String(ahora.getDate()).padStart(2,'0')}${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getHours()).padStart(2,'0')}${String(ahora.getMinutes()).padStart(2,'0')}-${choferReceptor.split(' ')[0].toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}`;

            num: 1,
            recoge: `Trasbordo de ${choferActual.nombre.split(' ')[0]} (${vehiculoBoleta})`,
            destinos: [sucursal],
            items: [{ dpto: descripcion }],
            prioSuc: {}
        };
        await sbFetch('POST', '/rest/v1/boletas', {
            id: codigoTrb, chofer: choferReceptor, vehiculo: vehiculoReceptor,
            hora_salida: hora, hora_emision: hora,
            destinos: sucursal, prioridad: 'Normal', estado: 'pendiente',
            fecha: fechaLocal, envios: JSON.stringify([envioTrb]),
            entregas_detalle: JSON.stringify({ [`${codigoTrb}_1_recogida`]: hora })
        });

        // 3. Notificar Discord
        await notificarDiscord(choferActual.nombre,
            `🔄 **Trasbordo — ${boletaId}**\n🕐 ${hora} | ${vehiculoBoleta}\n👤 ${choferActual.nombre.split(' ')[0]} → ${choferReceptor.split(' ')[0]} (${vehiculoReceptor})\n📦 ${descripcion}\n📍 Entrega en: ${sucursal}`,
            null, vehiculoBoleta

    async function confirmarTrasbordo(boletaId, envioNum, origen) {
        const choferReceptor = document.getElementById('tras-chofer')?.value;
        const descripcion = document.getElementById('tras-descripcion')?.value?.trim();
        const destino = document.getElementById('tras-destino')?.value;

        if (!descripcion) { mostrarToast('⚠️ Escribe qué se transborda'); return; }

        const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const ahora = new Date();
        const fechaLocal = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getDate()).padStart(2,'0')}`;

        const vehiculos = {
            'Darwin Serrano': 'Jack 07', 'Daniel Subero': 'NPR 01', 'Richard Hernandez': 'NPR 02',
            'Willmer Fernández': 'Fuso 03', 'Jackson Hernandez': 'Jack 06', 'Jesús Lara': 'L300 05', 'Néstor Daniel': 'NPR 04', 'José Marín': ''
        };
        const vehiculoReceptor = vehiculos[choferReceptor] || '';

        // 1. Cancelar la sucursal en la boleta de Néstor y agregar nota de trasbordo
        const listaBoleta = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=*`);
        if (!listaBoleta || !listaBoleta[0]) return;
        const b = listaBoleta[0];
        const detalle = JSON.parse(b.entregas_detalle || '{}');
        const envios = JSON.parse(b.envios || '[]');
        const vehiculoBoleta = b.vehiculo || choferActual.unidad || '';

        // Marcar destino como trasbordo
        const envioActual = envios.find(e => parseInt(e.num) === parseInt(envioNum));
        if (envioActual) {
            envioActual.destinos?.forEach(suc => {
                const key = `${boletaId}_${parseInt(envioNum)}_${suc}`;
                if (!detalle[key]) {
                    detalle[key] = `TRASBORDO ${hora} — A ${choferReceptor.split(' ')[0]} (${vehiculoReceptor}): ${descripcion}`;
                }
            });
        }

        const obsNestor = b.observaciones
            ? b.observaciones + `\n[${hora}] Trasbordo a ${choferReceptor.split(' ')[0]}: ${descripcion}`
            : `[${hora}] Trasbordo a ${choferReceptor.split(' ')[0]}: ${descripcion}`;

        await sbFetch('PATCH', `/rest/v1/boletas?id=eq.${boletaId}`, {
            entregas_detalle: JSON.stringify(detalle),
            observaciones: obsNestor
        });

        // 2. Crear nueva parada en la boleta del receptor o nueva boleta
        const codigoNuevo = `TRB-${String(ahora.getDate()).padStart(2,'0')}${String(ahora.getMonth()+1).padStart(2,'0')}-${String(ahora.getHours()).padStart(2,'0')}${String(ahora.getMinutes()).padStart(2,'0')}-${choferReceptor.split(' ')[0].toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}`;
        const envioTrb = {
            num: 1,
            recoge: `Trasbordo de ${choferActual.nombre.split(' ')[0]} (${vehiculoBoleta})`,
            destinos: [destino],
            items: [{ dpto: descripcion }],
            prioSuc: {}
        };
        const boletaTrb = {
            id: codigoNuevo,
            chofer: choferReceptor,
            vehiculo: vehiculoReceptor,
            hora_salida: hora,
            hora_emision: hora,
            destinos: destino,
            prioridad: 'Normal',
            estado: 'pendiente',
            fecha: fechaLocal,
            envios: JSON.stringify([envioTrb]),
            entregas_detalle: JSON.stringify({ [`${codigoNuevo}_1_recogida`]: hora })
        };
        await sbFetch('POST', '/rest/v1/boletas', boletaTrb);

        // 3. Notificar Discord — canal del que transborda
        await notificarDiscord(choferActual.nombre,
            `🔄 **Trasbordo — ${boletaId}**\n🕐 ${hora} | ${vehiculoBoleta}\n👤 ${choferActual.nombre.split(' ')[0]} → ${choferReceptor.split(' ')[0]} (${vehiculoReceptor})\n📦 ${descripcion}\n📍 Destino: ${destino}`,
            null, vehiculoBoleta
        );
        // Canal del que recibe
        await notificarDiscord(choferReceptor,
            `🔄 **Trasbordo recibido — ${codigoNuevo}**\n🕐 ${hora} | ${vehiculoReceptor}\n👤 Recibido de ${choferActual.nombre.split(' ')[0]} (${vehiculoBoleta})\n📦 ${descripcion}\n📍 Entrega en: ${destino}`,
            null, vehiculoReceptor
        );

        document.getElementById('modal-trasbordo').remove();
        mostrarToast(`✅ Trasbordo registrado — ${choferReceptor.split(' ')[0]} recibe`);
        cargarBoletas();
    }

    async function salirVacio(boletaId, origen, selectId) {
        const destino = document.getElementById(selectId)?.value || '';

        const keyLlegada = `${boletaId}_${origen}`;
        let tiempoTienda = '';
        if (horasLlegada[keyLlegada]) {
            const diffMin = Math.round((Date.now() - horasLlegada[keyLlegada]) / 60000);
            if (diffMin > 0) tiempoTienda = ` | ⏱️ ${diffMin} min en tienda`;
            delete horasLlegada[keyLlegada];

        const lista = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=vehiculo`);
        const veh = lista?.[0]?.vehiculo || choferActual.unidad || '';

        horasLlegada[`ruta_${destino}`] = ahora.getTime();

    async function confirmarRecogida(boletaId, envioNum, origen, uidRec, numItems) {
        const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const boleta = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=entregas_detalle,vehiculo`);
        if (!boleta || !boleta[0]) return;
        const detalle = JSON.parse(boleta[0].entregas_detalle || '{}');
        const vehiculoBoleta = boleta[0].vehiculo || choferActual.unidad || '';
        const key = `${boletaId}_${envioNum}_recogida`;

        let valorFinal = hora;
        // Subir fotos de cada ítem (o foto general si numItems === -1)
        const fotosUrls = [];
        const itemsASubir = numItems === -1 ? ['_gen'] : Array.from({length: numItems}, (_, i) => `_item${i}`);
        for (const sufijo of itemsASubir) {
            const uidItem = `${uidRec}${sufijo}`;
            if (fotosRecogida[uidItem]) {
                try {
                    const blob = await fetch(fotosRecogida[uidItem]).then(r => r.blob());
                    const nombreFoto = `recogidas/${boletaId}_${envioNum}_${sufijo}_${Date.now()}.jpg`;
                    const uploadRes = await fetch(`${SB_URL}/storage/v1/object/fotos-flota/${nombreFoto}`, {
                        method: 'POST',
                        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'image/jpeg' },
                        body: blob
                    });
                    if (uploadRes.ok) {
                        fotosUrls.push(`${SB_URL}/storage/v1/object/public/fotos-flota/${nombreFoto}`);
                    }
                } catch(e) { console.log('Error subiendo foto:', e); }
            }
        }
        if (fotosUrls.length > 0) {
            valorFinal = `${hora}|fotos:${fotosUrls.join(',')}`;
        }

        fotoEnProceso = false; // Reactivar auto-refresh
        detalle[key] = valorFinal;
        await sbFetch('PATCH', `/rest/v1/boletas?id=eq.${boletaId}`, { entregas_detalle: JSON.stringify(detalle) });
        mostrarToast(`✅ Recogida confirmada en ${origen} — ${hora}`);

        // Armar detalle de qué lleva
        const boletaInfo = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=envios`);
        let detalleItems = '';
        if (boletaInfo && boletaInfo[0]) {
            const envios = JSON.parse(boletaInfo[0].envios || '[]');
            const envio  = envios.find(e => e.num === envioNum || e.num === parseInt(envioNum));
            if (envio) {
                const items = (envio.items || []).map(i => `• ${i.dpto}${i.detalle ? ': '+i.detalle : ''}`).join('\n');
                const dests = (envio.destinos || []).join(', ');
                if (items) detalleItems += `\n📦 Lleva:\n${items}`;
                if (dests) detalleItems += `\n📍 Destinos: ${dests}`;
            }
        }

        // Notificar Discord — primera foto con el mensaje principal
        await notificarDiscord(
            choferActual.nombre,
            `📦 **Recogida confirmada en ${origen}**\n🕐 ${hora} | ${vehiculoBoleta}\n📋 Boleta: ${boletaId}${detalleItems}`,
            fotosUrls.length > 0 ? fotosUrls[0] : null,
            vehiculoBoleta
        );
        // Fotos adicionales como mensajes separados
        for (let fi = 1; fi < fotosUrls.length; fi++) {
            await notificarDiscord(choferActual.nombre, `📷 Foto ${fi + 1} de ${fotosUrls.length}`, fotosUrls[fi], vehiculoBoleta);
        }

        await cargarBoletas();
    }

    async function confirmarSucursalConNota(boletaId, envioNum, sucursal, observacion, notaRapida) {
        if (notaRapida) {
            const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            await notificarDiscord(choferActual.nombre,
                `📝 **Nota — ${boletaId}**\n🕐 ${hora} | ${choferActual.unidad || ''}\n👤 ${choferActual.nombre.split(' ')[0]}\n💬 ${notaRapida}`
            );
        }
        await confirmarSucursal(boletaId, envioNum, sucursal, observacion);
    }

    async function confirmarSucursal(boletaId, envioNum, sucursal, observacion = '') {
        const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const entKey = `${boletaId}_${parseInt(envioNum)}_${sucursal}`;
        // Guardar localmente para que no reaparezca el botón
        entregasConfirmadas[entKey] = hora;
        localStorage.setItem('entregasConfirmadas', JSON.stringify(entregasConfirmadas));

        // Cargar boleta actual
        const lista = await sbFetch('GET', `/rest/v1/boletas?id=eq.${boletaId}&select=*`) || [];
        if (!lista.length) return;
        const b = lista[0];
        const vehiculoBoleta = b.vehiculo || choferActual.unidad || '';
        const detalle = b.entregas_detalle ? JSON.parse(b.entregas_detalle) : {};
        detalle[entKey] = observacion ? `${hora} — ${observacion}` : hora;

        // Ver si todas entregadas
        const envios = b.envios ? JSON.parse(b.envios) : [];
        let todasEntregadas = true;
        envios.forEach(e => {
            (e.destinos || []).forEach(s => {
                if (!detalle[`${boletaId}_${parseInt(e.num)}_${s}`]) todasEntregadas = false;
            });
        });

        const update = { entregas_detalle: JSON.stringify(detalle) };

        // Armar qué llevaba a esta sucursal
        const envioActual = (b.envios ? JSON.parse(b.envios) : []).find(e => parseInt(e.num) === parseInt(envioNum));
        const prioSucData = envioActual?.prioSuc || {};
        const notaSuc = prioSucData[sucursal + '_nota'] || '';
        const itemsSuc = (envioActual?.items || []).map(i => `• ${i.dpto}${i.detalle ? ': ' + i.detalle : ''}`).join('\n');
        const queLlevaba = notaSuc || itemsSuc || '';

        // Calcular tiempo en tienda si hay hora de llegada registrada
        const keyLlegada = `${boletaId}_${sucursal}`;
        let tiempoTienda = '';
        if (horasLlegada[keyLlegada]) {
            const diffMin = Math.round((Date.now() - horasLlegada[keyLlegada]) / 60000);
            if (diffMin > 0) tiempoTienda = `\n⏱️ Tiempo en tienda: ${diffMin} min`;
            delete horasLlegada[keyLlegada];
        }

        // Siempre notificar la entrega individual
        await notificarDiscord(choferActual.nombre,
            `✅ **Entrega confirmada en ${sucursal}**\n🕐 ${hora} | ${vehiculoBoleta}\n📋 Boleta: ${boletaId}${queLlevaba ? '\n📦 ' + queLlevaba : ''}${observacion ? '\n⚠️ Novedad: ' + observacion : '\n✔️ Sin novedad'}${tiempoTienda}`,
            null, vehiculoBoleta
        );

        if (todasEntregadas) {
            update.estado = 'entregada';
            update.hora_entrega = hora;
            // Calcular duración
            let duracion = '';
            try {
                const parsarHora = h => {
                    if (!h) return new Date('Invalid');
                    // Si tiene a.m./p.m.
                    if (/a\.m\.|p\.m\./i.test(h)) {
                        const clean = h.replace(/\s*(a\.m\.)\s*/gi, ' AM').replace(/\s*(p\.m\.)\s*/gi, ' PM');
                        return new Date('1970/01/01 ' + clean);
                    }
                    // Formato HH:MM directo
                    return new Date('1970/01/01 ' + h);
                };
                const sal = parsarHora(b.hora_salida || '');
                const ent = parsarHora(hora);
                let diff = (ent - sal) / 60000;
                if (diff < 0) diff += 1440;
                const hh = Math.floor(diff / 60);
                const mm = Math.round(diff % 60);
                duracion = hh > 0 ? `${hh}h ${mm}min` : `${mm}min`;
            } catch(ex) {}
            update.duracion = duracion;

            // Resumen Discord
            let resumen = '';
            envios.forEach(e => {
                (e.destinos || []).forEach(s => {
                    const horaE = detalle[`${boletaId}_${parseInt(e.num)}_${s}`]?.split(' — ')[0] || '—';
                    resumen += `\n📍 ${s}   ✅ ${horaE}`;
                });
            });
            await notificarDiscord(choferActual.nombre,
                `🏁 **Boleta completada — ${boletaId}**\n👤 ${choferActual.nombre.split(' ')[0]} | 🚛 ${vehiculoBoleta}\n🕐 Salida: ${b.hora_salida} → Última entrega: ${hora}${duracion ? '\n⏱️ Duración total: ' + duracion : ''}${resumen}`,
                null, vehiculoBoleta
            );
        }

        await sbFetch('PATCH', `/rest/v1/boletas?id=eq.${boletaId}`, update);
        mostrarToast(`✅ ${sucursal} — entregado`);
        // NO recargar — el auto-refresh cada 30s se encarga
    }

    function cambiarVehiculo() {
        const vehiculos = ['NPR 01', 'NPR 02', 'NPR 04', 'Fuso 03', 'L300 05', 'Jack 06', 'Jack 07'];
        const actual = choferActual.unidad || 'Sin asignar';
        const sel = prompt(`Vehículo actual: ${actual}\n\n¿Cuál usas hoy?\n\n${vehiculos.map((v, i) => `${i+1}. ${v}`).join('\n')}\n\nEscribe el número:`);
        const idx = parseInt(sel) - 1;
        if (idx >= 0 && idx < vehiculos.length) {
            choferActual = { ...choferActual, unidad: vehiculos[idx] };
            localStorage.setItem('emp_chofer', JSON.stringify(choferActual));
            document.getElementById('topbar-unit').textContent = choferActual.unidad;
            mostrarToast(`✅ Vehículo cambiado a ${choferActual.unidad}`);
        }
    }

    function cerrarSesion() {
        if (!confirm('¿Cerrar sesión?')) return;
        localStorage.removeItem('emp_chofer');
        choferActual = null;
        document.getElementById('screen-login').style.display = 'flex';
        document.getElementById('screen-main').style.display = 'none';
        document.querySelectorAll('.chofer-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-huella').disabled = true;
    }

    function mostrarToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
    }

    // Al cargar: si ya hay chofer guardado, ir directo a huella
    // Recargar boletas automáticamente cuando el chofer vuelve a la app
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && choferActual && !fotoEnProceso) {
            mostrarToast('🔄 Actualizando boletas...');
            cargarBoletas();
        }
    });

    window.onload = function() {
        const guardado = localStorage.getItem('emp_chofer');
        if (guardado) {
            try {
                let chofer = JSON.parse(guardado);
                // Para choferes sin unidad fija, limpiar unidad para que pregunten al entrar
                // Todos los choferes seleccionan vehículo siempre
                mostrarSelectorVehiculo(chofer, (choferConVehiculo) => {
                    entrarConChofer(choferConVehiculo);
                });
            } catch(e) {
                localStorage.removeItem('emp_chofer');
            }
        }
    };
</script>
